defaultNamespace: cattle-elemental-system
# name: elemental-operator

releaseName: elemental-operator
atomic: true
waitForJobs: true
timeoutSeconds: 300
takeOwnership: true

helm:
  repo: "oci://registry.suse.com/rancher"
  chart: elemental-operator
  # chart: oci://registry.suse.com/rancher/elemental-operator-chart

rolloutStrategy:
  maxUnavailable: 15%
  maxNew: 50
